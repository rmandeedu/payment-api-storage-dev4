name: Provision AWS Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Provision
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # DEBUG 1 - GitHub repository / workflow information
      # Uses environment variables instead of ${{ github.* }}
      # so Backstage templating cannot interfere.
      # -------------------------------------------------------
      - name: Show GitHub context
        working-directory: .
        shell: bash
        run: |
          echo "=========================================="
          echo "GitHub Workflow Context"
          echo "=========================================="

          echo "Repository       : $GITHUB_REPOSITORY"
          echo "Repository Owner : $GITHUB_REPOSITORY_OWNER"
          echo "Ref              : $GITHUB_REF"
          echo "Ref Name         : $GITHUB_REF_NAME"
          echo "Workflow         : $GITHUB_WORKFLOW"
          echo "Event            : $GITHUB_EVENT_NAME"

          echo ""
          echo "Repository ID information from event:"
          jq '{
            repository: .repository.full_name,
            repository_id: .repository.id,
            owner: .repository.owner.login,
            owner_id: .repository.owner.id
          }' "$GITHUB_EVENT_PATH"

      # -------------------------------------------------------
      # DEBUG 2 - Obtain GitHub OIDC JWT and show SAFE claims
      # Do NOT print the JWT itself.
      # -------------------------------------------------------
      - name: Inspect GitHub OIDC claims
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checking GitHub OIDC configuration"
          echo "=========================================="

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "ERROR: ACTIONS_ID_TOKEN_REQUEST_URL is not available"
            exit 1
          fi

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "ERROR: ACTIONS_ID_TOKEN_REQUEST_TOKEN is not available"
            exit 1
          fi

          echo "OIDC environment variables are available."

          RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: GitHub did not return an OIDC token."
            exit 1
          fi

          echo "OIDC token successfully obtained."

          python3 - "$TOKEN" <<'PY'
          import base64
          import json
          import sys

          token = sys.argv[1]
          payload = token.split('.')[1]

          payload += '=' * (-len(payload) % 4)
          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode('utf-8')
          )

          safe_claims = {
              "sub": claims.get("sub"),
              "aud": claims.get("aud"),
              "repository": claims.get("repository"),
              "repository_id": claims.get("repository_id"),
              "repository_owner": claims.get("repository_owner"),
              "repository_owner_id": claims.get("repository_owner_id"),
              "ref": claims.get("ref"),
              "environment": claims.get("environment"),
              "workflow": claims.get("workflow"),
          }

          print(json.dumps(safe_claims, indent=2))
          PY

      # -------------------------------------------------------
      # AWS authentication
      # -------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::056033527058:role/CloudOpsIDPProvisioningRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          output-env-credentials: true

      # -------------------------------------------------------
      # Confirm exactly which AWS identity GitHub obtained
      # -------------------------------------------------------
      - name: Verify AWS Identity
        working-directory: .
        shell: bash
        run: |
          echo "=========================================="
          echo "AWS Caller Identity"
          echo "=========================================="
          aws sts get-caller-identity

      # -------------------------------------------------------
      # Terraform
      # -------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
