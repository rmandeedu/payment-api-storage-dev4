name: Provision AWS Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Provision
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show GitHub context
        working-directory: .
        run: |
          echo "Repository       : ${{ github.repository }}"
          echo "Repository ID    : ${{ github.repository_id }}"
          echo "Repository Owner : ${{ github.repository_owner }}"
          echo "Owner ID         : ${{ github.repository_owner_id }}"
          echo "Ref              : ${{ github.ref }}"
          echo "Ref Name         : ${{ github.ref_name }}"
          echo "Workflow         : ${{ github.workflow }}"
          echo "Event            : ${{ github.event_name }}"

      - name: Request and inspect OIDC token
        working-directory: .
        shell: bash
        run: |
          echo "Checking GitHub OIDC environment..."

          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "ERROR: ACTIONS_ID_TOKEN_REQUEST_URL is empty"
            exit 1
          fi

          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "ERROR: ACTIONS_ID_TOKEN_REQUEST_TOKEN is empty"
            exit 1
          fi

          echo "OIDC request environment is available"

          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          echo "OIDC endpoint responded"

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: OIDC token was not returned"
            echo "$RESPONSE"
            exit 1
          fi

          echo "OIDC token successfully obtained"

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)
          PAYLOAD=$(echo "$PAYLOAD" | tr '_-' '/+')

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "OIDC claims:"
          echo "$PAYLOAD" | base64 -d | jq '{
            sub,
            aud,
            repository,
            repository_id,
            repository_owner,
            repository_owner_id,
            ref,
            environment,
            workflow
          }'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::056033527058:role/CloudOpsIDPProvisioningRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          output-env-credentials: true

      - name: Verify AWS Identity
        working-directory: .
        run: |
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
